<section>
  <div class="notification-list-title-container">
    <h1>Notifications List</h1>
    <button mat-raised-button [routerLink]="['/notification', 'new']">
      Create Notification
    </button>
  </div>

  <mat-form-field>
    <input matInput (keyup)="applyFilter($event)" placeholder="Filter" />
  </mat-form-field>

  <div class="example-container mat-elevation-z8">
    <div class="example-table-container">
      <table mat-table [dataSource]="dataSource" matSort>
        <!-- icon Column -->
        <ng-container matColumnDef="icon">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>icon</th>
          <td
            mat-cell
            *matCellDef="let element"
            class="m-card-title"
            test
            data-label="icon"
          >
            <mat-icon> {{ element.icon }}</mat-icon>
          </td>
        </ng-container>

        <!-- message Column -->
        <ng-container matColumnDef="message">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Notification Message
          </th>
          <td
            mat-cell
            *matCellDef="let element"
            class="m-card-title"
            test
            data-label="message"
          >
            {{ element.message }}
          </td>
        </ng-container>

        <!-- metadata Column -->
        <ng-container matColumnDef="metadata">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>metadata</th>
          <td
            mat-cell
            *matCellDef="let element"
            class="m-card-sub-title"
            data-label="metadata"
          >
            {{ element.metadata }}
          </td>
        </ng-container>
        <!-- createdAt Column -->
        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Last modified
          </th>
          <td
            mat-cell
            *matCellDef="let element"
            class="has_label_on_mobile"
            data-label="Last modified on"
          >
            {{ element.createdAt | date }}
          </td>
        </ng-container>
        <!-- updatedAt Column -->
        <ng-container matColumnDef="updatedAt">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Last modified
          </th>
          <td
            mat-cell
            *matCellDef="let element"
            class="has_label_on_mobile"
            data-label="Last modified on"
          >
            {{ element.updatedAt | date }}
          </td>
        </ng-container>

        <!-- Symbol Column -->
        <ng-container matColumnDef="star">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let element">
            <button
              mat-icon-button
              [matMenuTriggerFor]="menu"
              (click)="selectedNotification = element"
            >
              <mat-icon>more_vert</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns; sticky: true"
        ></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
    <mat-paginator [pageSizeOptions]="[10, 20, 30]"></mat-paginator>
  </div>

  <mat-menu #menu="matMenu">
    <button mat-menu-item (click)="editNotification(selectedNotification.id)">
      <mat-icon>edit</mat-icon>
      <span>edit notification</span>
    </button>
    <button mat-menu-item (click)="onDelete(selectedNotification.id)">
      <mat-icon>delete</mat-icon>
      <span>Delete notification</span>
    </button>
  </mat-menu>
</section>
